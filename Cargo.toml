[workspace]
members = [
    "crates/fsr-types",
    "crates/fsr-fixed",
    "crates/fsr-temporal",
    "crates/fsr-nullcenter",
    "crates/fsr-resonance",
    "crates/fsr-gate",
    "crates/fsr-mirror",
    "crates/fsr-candidates",
    "crates/fsr-csp",
    "crates/fsr-hedge",
    "crates/fsr-calibration",
    "crates/fsr-chain",
    "crates/fsr-governance",
    "crates/fsr-runtime",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"

[profile.release]
opt-level = 3
