[workspace]
members = [
    "crates/fsr-types",
    "crates/fsr-fixed",
    "crates/fsr-temporal",
    "crates/fsr-nullcenter",
    "crates/fsr-resonance",
    "crates/fsr-gate",
    "crates/fsr-mirror",
    "crates/fsr-candidates",
    "crates/fsr-csp",
    "crates/fsr-hedge",
    "crates/fsr-calibration",
    "crates/fsr-chain",
    "crates/fsr-governance",
    "crates/fsr-runtime",
    "crates/fsr-tui",
    "crates/fsr-ttcp",
    "crates/fsr-dshae",
    "crates/fsr-gui",
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
rand = "0.8"
bincode = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
notify = "6"
crossbeam-channel = "0.5"
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.29"

[profile.release]
opt-level = 3
