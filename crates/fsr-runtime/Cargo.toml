[package]
name = "fsr-runtime"
version.workspace = true
edition.workspace = true

[[bin]]
name = "fsr"
path = "src/main.rs"

[features]
# TUI dashboard (ratatui + crossterm)
tui = ["dep:fsr-tui"]
# Live market data via Binance WebSocket
live-data = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util"]
# Live order execution via Binance REST (implies live-data)
live-exec = ["live-data", "dep:reqwest"]

[dependencies]
fsr-types = { path = "../fsr-types" }
fsr-fixed = { path = "../fsr-fixed" }
fsr-temporal = { path = "../fsr-temporal" }
fsr-nullcenter = { path = "../fsr-nullcenter" }
fsr-resonance = { path = "../fsr-resonance" }
fsr-gate = { path = "../fsr-gate" }
fsr-mirror = { path = "../fsr-mirror" }
fsr-candidates = { path = "../fsr-candidates" }
fsr-csp = { path = "../fsr-csp" }
fsr-hedge = { path = "../fsr-hedge" }
fsr-calibration = { path = "../fsr-calibration" }
fsr-chain = { path = "../fsr-chain" }
fsr-governance = { path = "../fsr-governance" }
fsr-ttcp = { path = "../fsr-ttcp" }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
bincode = { workspace = true }
sha2 = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
notify = { workspace = true }
crossbeam-channel = { workspace = true }

# Optional feature-gated dependencies
fsr-tui = { path = "../fsr-tui", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
tokio-tungstenite = { version = "0.21", optional = true }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.11", features = ["json"], optional = true }
